<script>
const $=s=>document.querySelector(s),PI=Math.PI,TAU=PI*2,DUR=240,ST=[0,25,55,100,135,175,205,230];
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),sm=x=>{x=cl(x);return x*x*(3-2*x)};
const V=(x,y,z)=>new THREE.Vector3(x,y,z),S=(th,ph,r=1)=>V(r*Math.sin(th)*Math.sin(ph),r*Math.cos(th),r*Math.sin(th)*Math.cos(ph));
const TE=1.309,TL=1.83,W=TL-TE; // limite ectoderme (75°) et lèvre initiale (105°)
/* ---------- cellules ---------- */
const C=[];
function ring(r,a,b,sz,L,sn){const dt=.88*sz/r;let k=0;for(let th=a+dt/2;th<b;th+=dt,k++){const n=Math.max(1,Math.round(TAU*r*Math.sin(th)/sz));for(let i=0;i<n;i++)C.push({th,ph:((i+(k%2)*.5)/n)*TAU-PI,r,sz,sn,L,k:th<TE?'e':th<TL?'m':'v',d0:TL-th})}}
ring(.96,0,TL,.11,0,.048);ring(.86,0,TL,.11,1,.048);ring(.92,TL,PI,.22,2,.095);
for(let x=-.7;x<=.71;x+=.22)for(let y=-.7;y<=.12;y+=.22)for(let z=-.7;z<=.71;z+=.22){const p=V(x,y,z);if(p.length()<.7&&p.distanceTo(V(0,.14,0))>.74)C.push({k:'c',p,sz:.22,sn:.105,L:3})}
const n=C.length;
/* ---------- cinématique (modèle schématique) ---------- */
const KK={t:-1},tv=V(0,0,0);
const Ifn=(ph,t)=>{const T0=32+30*(1-Math.cos(ph));return(.45+.425*(1+Math.cos(ph)))*sm((t-T0)/(215-T0))};
function K(t){if(KK.t===t)return;KK.t=t;KK.thL=TL+(2.85-TL)*sm((t-70)/155);KK.ce=sm((t-105)/85);KK.g=sm((t-30)/200);KK.b=sm((t-26)/32);KK.bw=.45+.9*sm((t-45)/120);KK.str=1+.5*KK.g+.3*KK.ce;KK.Id=Ifn(0,t);KK.ax=[];if(KK.Id>.04){const tp=KK.thL-KK.Id*KK.str;for(let j=0;j<7;j++)KK.ax.push(S(KK.thL+(tp-KK.thL)*j/6,0,.52));KK.rho=.1+.1*KK.g}}
function st(c,t,o){K(t);
 if(c.k=='c'){o.p.copy(c.p);for(const a of KK.ax){const d=o.p.distanceTo(a),m=KK.rho+.13;if(d<m&&d>1e-4)o.p.addScaledVector(tv.copy(o.p).sub(a),(m-d)/d)}o.a.set(1,0,0);o.n.set(0,1,0);o.u.set(0,0,1);o.sa=o.sb=o.sn=.115;return}
 let th=c.th,ph=c.ph,r=c.r,sa=c.sz*.53,sb=sa,sn=c.sn;
 if(c.k=='e'){const k=(KK.thL-Math.max(0,W-Ifn(ph,t)))/TE;th=c.th*k;const s=cl(Math.sqrt(k*Math.sin(th)/Math.max(Math.sin(c.th),.1)),1,1.7);sa*=s;sb*=s;sn*=Math.max(.55,1/(s*s))} // épibolie
 else if(c.k=='m'){const lam=Ifn(c.ph,t)-c.d0,dw=cl((1.2-Math.abs(c.ph))/.8);
  if(lam<=0)th=KK.thL+lam;else{const w=cl(lam/.25);th=Math.max(.35,KK.thL-lam*KK.str+.1*Math.sin(PI*w));r=c.r+((c.L?.75:.64)-c.r)*sm(w)} // involution
  ph=c.ph*(1-.5*KK.ce*dw);sa*=1-.25*KK.ce*dw;sb*=1+.5*KK.ce*dw; // convergence-extension
  if(c.L==0&&c.d0<.14&&Math.abs(c.ph)<KK.bw){const bb=KK.b*(lam<.2?1:cl(1-(lam-.2)/.2));sa*=1-.55*bb;sb*=1-.5*bb;sn*=1+1.7*bb;r-=.07*bb}} // cellules en bouteille
 else{const f=(PI-KK.thL)/(PI-TL);th=KK.thL+(c.th-TL)*f;r-=.1*(1-f);sa*=.5+.5*f;sb*=.5+.5*f} // bouchon vitellin
 th=cl(th,.04,PI-.04);const sT=Math.sin(th),cT=Math.cos(th),sP=Math.sin(ph),cP=Math.cos(ph);
 o.p.set(r*sT*sP,r*cT,r*sT*cP);o.a.set(cT*sP,-sT,cT*cP);o.u.set(cP,0,-sP);o.n.set(sT*sP,cT,sT*cP);o.sa=sa;o.sb=sb;o.sn=sn}
/* ---------- scène ---------- */
const cv=$('#cv'),R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.localClippingEnabled=true;cv.prepend(R.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,1,.02,50),cp=new THREE.Plane(V(-1,0,0),9),CP=[cp];
sc.add(new THREE.HemisphereLight(0xffffff,0x667788,1.15));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(2,3,4);sc.add(dl);
const G=new THREE.SphereGeometry(1,10,8),
 mem=new THREE.InstancedMesh(G,new THREE.MeshStandardMaterial({transparent:true,opacity:.8,roughness:.5,clippingPlanes:CP}),n),
 out=new THREE.InstancedMesh(G,new THREE.MeshBasicMaterial({color:0x22160c,side:THREE.BackSide,transparent:true,clippingPlanes:CP}),n),
 nuc=new THREE.InstancedMesh(new THREE.SphereGeometry(1,8,6),new THREE.MeshStandardMaterial({color:0x40306e,roughness:.7,clippingPlanes:CP}),n);
[mem,out,nuc].forEach(m=>{m.frustumCulled=false;sc.add(m)});
const tr=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,depthWrite:false,clippingPlanes:CP}),
 bl=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),tr(0x7fc8ff,.2)),ar=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),tr(0x2fe0c0,.32)),
 fn=new THREE.Mesh(new THREE.SphereGeometry(.8,24,8,0,TAU,0,1.9),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.5,clippingPlanes:CP}));
fn.visible=false;sc.add(bl,ar,fn);
const o={p:V(0,0,0),a:V(0,0,0),u:V(0,0,0),n:V(0,0,0)},M=new THREE.Matrix4(),X=V(0,0,0),Y=V(0,0,0),Z=V(0,0,0),pos=new Float32Array(n*3);
/* couleurs */
const cA=new THREE.Color(0x6a4528),cB=new THREE.Color(0xe9dcae),TC={e:0x4a8fd9,pre:0xf08a24,cho:0xd6322d,lat:0xe8667a,end:0xf0c030,lin:0xd9a441};
function colr(c,mode){const q=new THREE.Color();if(mode){if(c.k=='e')q.set(TC.e);else if(c.k=='m'){if(c.L==0)q.set(TC.lin);else if(Math.abs(c.ph)<.55)q.set(c.d0<.2?TC.pre:TC.cho);else q.set(TC.lat)}else q.set(TC.end);return q}
 q.copy(cA).lerp(cB,c.k=='c'?1:cl((c.th-.9)/1.4));if(c.L==1)q.lerp(new THREE.Color(0xffffff),.15);return q}
const recolor=()=>{C.forEach((c,i)=>mem.setColorAt(i,colr(c,col)));mem.instanceColor.needsUpdate=true};
/* trajectoires */
const TR=new THREE.Group(),tracks=[],ad=(a,b)=>Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)));TR.visible=false;sc.add(TR);
const pick=f=>{let b=null,bd=9;for(const c of C)if(c.k!='c'){const d=f(c);if(d<bd){bd=d;b=c}}return b};
[[0,.05],[0,.3],[.7,.05],[-.7,.3],[1.5,.1],[-1.5,.3],[PI,.1]].forEach(([p,d])=>tracks.push([pick(c=>c.k=='m'&&c.L==1?ad(c.ph,p)+Math.abs(c.d0-d):9),0xd6322d]));
[[0,.5],[0,1.1],[PI,.8]].forEach(([p,t])=>tracks.push([pick(c=>c.k=='e'&&c.L==1?ad(c.ph,p)+Math.abs(c.th-t):9),0x4a8fd9]));
tracks.forEach(T=>{T.pts=[];for(let t=0;t<=DUR;t+=4){st(T[0],t,o);T.pts.push(o.p.clone())}TR.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(T.pts),new THREE.LineBasicMaterial({color:T[1],clippingPlanes:CP})))});
const cg=new THREE.ConeGeometry(.03,.1,8).rotateX(PI/2),cones=new THREE.InstancedMesh(cg,new THREE.MeshBasicMaterial({color:0xffffff,clippingPlanes:CP}),tracks.length);TR.add(cones);
/* jonctions : paires de voisines à t=0 */
const P0=C.map(c=>{st(c,0,o);return o.p.clone()}),J=[],rr=c=>c.k=='c'?.11:c.sz/2,JC=[0xffd43b,0xe03131,0x2fbf71,0x3b82f6];
for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=C[i],b=C[j];if(J.length<6000&&P0[i].distanceTo(P0[j])<1.15*(rr(a)+rr(b))){if(a.L==0&&b.L==0)J.push([i,j,0,.025],[i,j,1,-.01]);else if(a.L<2&&b.L<2&&(i+j)%3==0)J.push([i,j,2,0]);else J.push([i,j,3,0])}}
const jm=new THREE.InstancedMesh(new THREE.SphereGeometry(.017,6,4),new THREE.MeshBasicMaterial({clippingPlanes:CP}),J.length);J.forEach((q,i)=>jm.setColorAt(i,new THREE.Color(JC[q[2]])));jm.visible=false;jm.frustumCulled=false;sc.add(jm);
/* ---------- textes ---------- */
const SN=['Blastula','Lèvre dorsale','Involution','Épibolie','Convergence-ext.','Archentéron','Fermeture','Fin'];
const TX=[
['Étape 1 – Embryon avant gastrulation (blastula âgée)','Hémisphère animal : petites cellules pigmentées (blastoderme) formant le toit du blastocœle. Hémisphère végétatif : grosses cellules riches en vitellus (plancher). La zone marginale, intermédiaire, contient le mésoderme présomptif ; l’ectoderme est animal, l’endoderme végétatif.'],
['Étape 2 – Lèvre dorsale du blastopore','Côté dorsal, des cellules superficielles de la zone marginale deviennent « en bouteille » : pôle apical constricté, partie basale allongée. Elles courbent l’épithélium (invagination initiale) et marquent la lèvre dorsale. Leur rôle exact est discuté : elles initient la courbure plutôt que de la causer seules (Hardin et Keller, 1988).'],
['Étape 3 – Involution','Involution : mouvement vers l’intérieur d’une couche externe qui s’étend sur la face interne des cellules restées à l’extérieur. Les cellules proches de la lèvre entrent d’abord (mésoderme préchordal), puis la chorde, et migrent sous le toit du blastocœle sur la fibronectine (intégrines). Expérience de Boucaut (1984) : sans matrice, les cellules évitent la zone.'],
['Étape 4 – Épibolie de l’ectoderme','Épibolie : les feuillets d’épithélium s’étendent en bloc pour entourer les couches profondes. L’ectoderme animal s’amincit et s’étale (intercalation radiale), le blastocœle se réduit. Les divisions cellulaires ne sont pas représentées.'],
['Étape 5 – Convergence-extension','Les cellules du mésoderme dorsal s’allongent médiolatéralement et s’intercalent entre elles : le tissu converge vers l’axe dorsal (étroitesse) et s’allonge selon l’axe antéro-postérieur (Keller et Danilchik, 1988).'],
['Étape 6 – Formation de l’archentéron','L’archentéron (futur tube digestif) apparaît entre le toit mésodermique involué et l’endoderme vitellin ; il s’allonge tandis que le blastocœle, refoulé, diminue. Son revêtement dorsal inclut des cellules superficielles de la zone marginale (représentation schématique).'],
['Étape 7 – Fermeture du blastopore','La lèvre dorsale est suivie des lèvres latérales puis ventrale : le blastopore se referme en cercle autour du bouchon vitellin (cellules endodermiques), qui s’internalise.'],
['Étape 8 – Fin de gastrulation','Trois feuillets : ectoderme externe ; mésoderme (chorde, mésoderme préchordal, latéral, ventral) ; endoderme (revêtement de l’archentéron, cellules vitellines). Axes antéro-postérieur et dorso-ventral en place ; suite : neurulation. Utiliser « Coupe » pour les structures internes.']];

const LS=[
['Pôle animal',0,100,A(0,0,1),0],['Pôle végétatif',0,240,A(PI,0,1),0],
['Hémisphère animal (petites cellules)',0,55,A(.8,-1,.97),0],['Hémisphère végétatif (grosses cellules)',0,100,A(2.5,1.7,.95),0],
['Zone marginale',0,100,A(1.57,-1.3,.97),0,'Région intermédiaire entre les hémisphères animal et végétatif.|Cellules équatoriales du blastoderme.|Siège de l’induction du mésoderme ; la lèvre s’y forme.|Mésoderme (cellules profondes).'],
['Blastoderme',0,55,A(.35,2.4,.97),0],['Blastocœle',0,175,BL,1,'Cavité de la blastula, décalée vers l’animal.|Écartement des cellules animales lors de la segmentation.|Espace de migration des cellules involuées sous son toit.|Réduit puis refoulé par l’archentéron.'],
['Blastocœle résiduel',175,240,BL,1],['Plaque de toit du blastocœle',0,60,A(.45,.3,.8),1],['Plaque de plancher du blastocœle',0,60,()=>V(0,-.5,.1),1],
['Lèvre dorsale du blastopore',25,135,LP(0,-.25,.97),0,'Sillon où commence l’involution, côté dorsal.|Cellules en bouteille de la zone marginale dorsale.|Point d’entrée du mésoderme dans l’embryon.|S’étend en lèvres latérales puis ventrale.'],
['Cellules en bouteille (constriction apicale)',25,100,LP(-.06,.3,.99),0,'Cellules épithéliales à pôle apical constricté et base allongée.|Cellules superficielles de la zone marginale dorsale.|Courbent l’épithélium : invagination initiale.|Restent au bord de la lèvre ; puis intégrées.'],
['Zone dorsale',25,60,A(.9,0,1),0],['Invagination initiale',25,60,LP(.05,0,.9),1],
['Involution',55,175,LP(0,.45,.97),0,'Enroulement vers l’intérieur de la zone marginale par la lèvre.|Zone marginale involutive (cellules proches de la lèvre d’abord).|Met en place mésoderme et endoderme à l’intérieur.|Formation du toit mésodermique de l’archentéron.'],
['Mésoderme présomptif',55,100,A(1.5,.9,.97),0],['Endoderme présomptif',55,100,A(2.4,-.5,.95),0],['Cellules involutives',55,135,TP(.15,0,.75),1],
['Mésoderme préchordal',70,240,TP(1,0,.72),1,'Mésoderme dorsal antérieur, bord avant de l’involution.|Cellules dorsales les plus proches de la lèvre.|Migre en tête sous le toit du blastocœle.|Mésoderme de la région antérieure (tête).'],
['Chorde présomptive',90,240,TP(.45,0,.74),1,'Mésoderme dorsal axial derrière le préchordal.|Cellules dorsales involuées après le préchordal.|Subit convergence-extension et allonge l’axe.|Chorde dorsale, axe de l’embryon.'],
['Épibolie',100,235,A(1,1.9,.97),0,'Étalement de l’ectoderme pour recouvrir l’embryon.|Ectoderme animal.|Entraîne la lèvre vers le pôle végétatif.|Ectoderme couvrant tout sauf le bouchon.'],
['Ectoderme (présomptif)',100,240,A(.5,-.7,.97),0,'Feuillet externe.|Cellules animales du blastoderme.|S’étale par épibolie.|Épiderme et système nerveux.'],
['Convergence-extension',135,205,TP(.6,.5,.74),1,'Rétrécissement et allongement d’un tissu par intercalation.|Mésoderme dorsal.|Allonge l’axe antéro-postérieur et pousse l’embryon.|Chorde et somites allongés.'],
['Intercalation médiolatérale',135,205,TP(.3,-.45,.75),1],
['Archentéron',175,240,()=>S(KK.thL-KK.Id*KK.str*.5,0,.52),1,'Cavité interne ouverte par le blastopore.|Entre toit mésodermique involué et endoderme.|Futur lumen digestif ; son toit s’allonge.|Tube digestif.'],
['Blastopore et lèvre blastoporale',175,240,LP(0,-.5,.98),0],
['Bouchon vitellin',175,240,()=>S(Math.min(KK.thL+.12,PI-.1),.6,.97),0,'Cellules endodermiques vitellines visibles dans le blastopore.|Cellules végétatives.|Reste exposé tant que le blastopore n’est pas fermé.|Internalisé dans l’endoderme.'],
['Lèvre ventrale',205,240,LP(0,PI,.98),0],['Lèvres latérales',205,240,LP(0,1.57,.98),0],
['Mésoderme',230,240,TP(.7,.9,.75),1,'Feuillet intermédiaire.|Zone marginale involuée.|Forme le toit de l’archentéron.|Chorde, somites, reins, cœur…'],
['Endoderme',230,240,()=>V(0,-.3,-.2),1,'Feuillet interne.|Cellules végétatives et revêtement.|Tapisse l’archentéron.|Tube digestif et dérivés.'],
